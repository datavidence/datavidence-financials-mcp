name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers past commits, not just the tip.
          fetch-depth: 0
      # Open-source gitleaks CLI (Apache-2.0); the gitleaks-action requires a
      # paid license for org-owned repos. Allowlist lives in .gitleaks.toml.
      - name: Run gitleaks
        run: |
          VER=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
